services:
  postgres:
    image: postgres:16
    container_name: notification-service-postgres
    environment:
      POSTGRES_DB: notification_db
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - notification_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d notification_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  notification_pgdata: